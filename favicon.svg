<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d0c18"/>
  <rect width="32" height="32" rx="7" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1828"/>
      <stop offset="100%" stop-color="#0d0c18"/>
    </linearGradient>
  </defs>
  <!-- Gold border -->
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="none" stroke="#c9a44a" stroke-width="1.5" opacity="0.6"/>
  <!-- K letterform -->
  <text x="16" y="23" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="20" 
    font-weight="700"
    font-style="italic"
    fill="#c9a44a" 
    text-anchor="middle">K</text>
</svg>
